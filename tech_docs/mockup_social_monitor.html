<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Bengali:wght@500;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1440px;
    height: 757px;
    position: relative;
    overflow: hidden;
    font-family: 'Inter', 'Noto Sans Bengali', Tahoma, sans-serif;
  }

  .bg-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 1440px;
    height: 757px;
    object-fit: cover;
    z-index: 1;
  }

  .header-banner {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    background: linear-gradient(90deg, #09122C 0%, #172554 100%);
    color: #ffffff;
    padding: 8px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #38bdf8;
    z-index: 20;
  }

  /* Desktop Icons Mockup */
  .desktop-icons-container {
    position: absolute;
    top: 180px;
    left: 360px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
  }

  .retro-icon-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 76px;
    cursor: pointer;
    text-align: center;
  }

  .retro-icon-img {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 1px 1px #fff, inset -1px -1px #808080, 2px 2px 5px rgba(0,0,0,0.3);
  }

  .retro-icon-label {
    margin-top: 4px;
    font-size: 11px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 1px 1px 2px #000, -1px -1px 2px #000;
    padding: 1px 3px;
    background: rgba(0,0,128,0.7);
    border-radius: 2px;
  }

  .badge-monitor {
    position: absolute;
    top: 130px;
    left: 340px;
    background: #0284c7;
    color: #fff;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    z-index: 10;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  /* Callout on Contact Window */
  .contact-social-card-mock {
    position: absolute;
    top: 240px;
    right: 360px;
    width: 310px;
    background: #f0f4f8;
    border: 2px solid #000080;
    border-radius: 4px;
    padding: 14px;
    z-index: 10;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }

  .card-head {
    font-size: 12px;
    font-weight: bold;
    color: #000080;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid #cbd5e1;
    padding-bottom: 4px;
  }

  .social-grid-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .social-link-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border: 2px solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    background: #e2e8f0;
    font-size: 11px;
    font-weight: bold;
    color: #0f172a;
    border-radius: 2px;
  }

  .social-link-btn svg { width: 14px; height: 14px; }
</style>
</head>
