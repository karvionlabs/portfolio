  <style>
    body{background-color:#000;margin:0;overflow:hidden}
    #webgl{pointer-events:none}
    #ui-app{width:100%;height:100%;position:relative;display:flex;justify-content:center;align-items:center;box-sizing:border-box}
    #ui{position:absolute;overflow:hidden;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;box-sizing:border-box}
    #monitor-videos{pointer-events:none;position:absolute;opacity:0;width:0;height:0;top:0;left:0}
    #css{cursor:pointer}
    #ui-interactive{position:absolute;top:0;left:0;width:auto;pointer-events:auto}
    video{position:absolute;top:0;pointer-events:none}

    /* Modern Floating Social Dock (Top-Right) */
    .social-dock-container {
      position: fixed;
      top: 22px;
      right: 24px;
      z-index: 999999;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 10px;
      border-radius: 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      pointer-events: auto !important;
      user-select: none;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
    }
    .social-dock-container:hover {
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      transform: translateY(-1px);
    }
    .social-dock-btn {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
    }
    .social-dock-btn:hover {
      transform: scale(1.12);
      filter: brightness(1.08);
      box-shadow: 0 5px 14px rgba(24, 119, 242, 0.45);
    }
    .social-dock-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      display: block;
      pointer-events: none;
    }
    .facebook-btn {
      background: #1877F2;
    }
    @media only screen and (max-width: 768px) {
      .social-dock-container {
        top: 16px;
        right: 16px;
        padding: 5px 8px;
      }
      .social-dock-btn {
        width: 32px;
        height: 32px;
      }
      .social-dock-btn svg {
        width: 17px;
        height: 17px;
      }
    }
  </style>
  <title>Abdullah Karif Shahjada - AI Automation Portfolio</title>

  <script>
    window.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
        e.preventDefault();
        var storedPwd = localStorage.getItem('folio_admin_pwd') || '1234';
        var entered = prompt("🔒 Windows Security: Enter Administrator Password (Default: 1234):");
        if (entered === storedPwd) {
          sessionStorage.setItem('folio_admin_authed', 'true');
          window.open('/admin.html', '_blank');
        } else if (entered !== null) {
          alert("❌ Access Denied: Incorrect Administrator Password.");
        }
      }
    });
  </script>
