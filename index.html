    /* Modern Floating Social Dock (Top-Right Vertical Stack) */
    .social-dock-container {
      position: fixed;
      top: 22px;
      right: 24px;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 9px 7px;
      border-radius: 32px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2), 0 2px 8px rgba(0, 0, 0, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      pointer-events: auto !important;
      user-select: none;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
    }
    .social-dock-container:hover {
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.26);
      transform: translateY(-2px);
    }
    .social-dock-btn {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s ease, box-shadow 0.22s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.16), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }
    .social-dock-btn:hover {
      transform: translateY(-2px) scale(1.12);
      filter: brightness(1.08);
    }
    .facebook-btn {
      background: linear-gradient(135deg, #1877F2 0%, #166fe5 100%);
    }
    .facebook-btn:hover {
      box-shadow: 0 6px 18px rgba(24, 119, 242, 0.55);
    }
    .youtube-btn {
      background: linear-gradient(135deg, #FF0000 0%, #e60000 100%);
    }
    .youtube-btn:hover {
      box-shadow: 0 6px 18px rgba(255, 0, 0, 0.55);
    }
    .linkedin-btn {
      background: linear-gradient(135deg, #0A66C2 0%, #004182 100%);
    }
    .linkedin-btn:hover {
      box-shadow: 0 6px 18px rgba(10, 102, 194, 0.55);
    }
    .social-dock-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      display: block;
      pointer-events: none;
    }
    @media only screen and (max-width: 768px) {
      .social-dock-container {
        top: 16px;
        right: 16px;
        padding: 7px 5px;
        gap: 8px;
      }
      .social-dock-btn {
        width: 32px;
        height: 32px;
      }
      .social-dock-btn svg {
        width: 17px;
        height: 17px;
      }
    }
  </style>
